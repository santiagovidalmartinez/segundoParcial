spring.application.name=question-service
server.port=8083

# Validation Service (comunicacion sincrona REST)
validation.service.url=http://localhost:8082

# Base de datos H2 en memoria (consola: http://localhost:8083/h2-console, JDBC URL jdbc:h2:mem:questiondb, usuario sa)
spring.datasource.url=jdbc:h2:mem:questiondb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# RabbitMQ (comunicacion asincrona)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
